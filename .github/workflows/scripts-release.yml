name: scripts-release

# Refreshes the `scripts-latest` GitHub Release whenever any customer-shipped
# script changes on main. Customer docs reference release-asset URLs, which
# stay stable across file moves and refactors:
#
#   https://github.com/<owner>/<repo>/releases/download/scripts-latest/<file>
#
# The release is marked --prerelease so it doesn't claim the repo's
# top-level "Latest release" badge, which belongs to chart releases
# published by chart-releaser-action.

on:
  push:
    branches: [main]
    paths: ['scripts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh scripts-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Delete any prior release + tag so the recreated assets keep the
          # same download URLs (gh appends a counter if a release with the
          # same tag already exists).
          gh release delete scripts-latest --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create scripts-latest --repo "$REPO" \
            --title "Customer scripts (latest)" \
            --notes "Customer-facing scripts for self-managed dataplane installs: AWS preflight validator and post-install verifier, with config templates. Refreshed on every change to scripts/ on main." \
            --prerelease \
            scripts/preflight/validate-savant-dataplane-aws.sh \
            scripts/preflight/savant-preflight.conf.example \
            scripts/verify/verify-savant-dataplane.sh \
            scripts/verify/savant-verify.conf.example
