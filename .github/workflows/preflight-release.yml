name: preflight-release

# Refreshes the `preflight-latest` GitHub Release whenever the preflight
# scripts change on main. Customer docs reference the release-asset URL,
# which stays stable across file moves and refactors:
#
#   https://github.com/<owner>/<repo>/releases/download/preflight-latest/<file>
#
# The release is marked --prerelease so it doesn't claim the repo's
# top-level "Latest release" badge, which belongs to chart releases
# published by chart-releaser-action.

on:
  push:
    branches: [main]
    paths: ['scripts/preflight/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh preflight-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Delete any prior release + tag so the recreated assets keep the
          # same download URLs (gh appends a counter if a release with the
          # same tag already exists).
          gh release delete preflight-latest --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create preflight-latest --repo "$REPO" \
            --title "Preflight scripts (latest)" \
            --notes "AWS preflight validator and config template for self-managed dataplane installs. Refreshed on every change to scripts/preflight/ on main." \
            --prerelease \
            scripts/preflight/validate-savant-dataplane-aws.sh \
            scripts/preflight/savant-preflight.conf.example
