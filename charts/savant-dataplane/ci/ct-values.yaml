# Overrides applied by chart-testing against a single-node kind cluster in CI.
# Real installs use charts/savant-dataplane/values.yaml.
zookeeper:
  replicaCount: 1
  pdb:
    create: false
  persistence:
    enabled: false

spark-operator:
  controller:
    replicas: 1

# Kind can't satisfy the real Spark resource defaults; shrink everything,
# and disable the master HA hook (single-node clusters can't schedule 3 masters).
spark:
  master:
    resources: {}
    podDisruptionBudget:
      enabled: false
    affinity: {}
  worker:
    replicaCount: 1
    resources: {}
    affinity: {}
    extraVolumes: []
    extraVolumeMounts: []

_internal:
  postInstallHooks:
    sparkMasterHaScale:
      enabled: false
