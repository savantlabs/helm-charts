# Overrides applied by chart-testing against a single-node kind cluster in CI.
# Real installs use charts/savant-dataplane/values.yaml.
zookeeper:
  replicaCount: 1
  pdb:
    create: false
  persistence:
    enabled: false

spark-operator:
  controller:
    replicas: 1

# Kind can't satisfy the real Spark resource defaults and can't schedule 3
# masters; shrink everything.
spark:
  master:
    replicaCount: 1
    # Helm deep-merges maps, so {} won't override parent requests/limits.
    # null drops the block; resourcesPreset "none" skips the fallback preset.
    resources: null
    resourcesPreset: "none"
    podDisruptionBudget:
      enabled: false
    affinity: null
  worker:
    replicaCount: 1
    # kind has a single "service" node; null drops the spark-pool selector so
    # the worker can schedule there.
    nodeSelector: null
    resources: null
    resourcesPreset: "none"
    affinity: null
    extraVolumes: []
    extraVolumeMounts: []

# TEI downloads a ~1.3 GB model on startup; disable in kind to keep install fast.
tei:
  enabled: false

# Agent image is in a Savant private-ish registry path and requires live
# Savant-backend WIF credentials; disable in kind.
agent:
  enabled: false

# Analytic engine needs the full Spark cluster up; skip in kind.
analyticEngine:
  enabled: false

# _validate.yaml requires cloudProvider=aws; satisfy it with a dummy value
# so template rendering succeeds without setting real cloud credentials.
savantConfig:
  cloudProvider: aws
