apiVersion: v2
name: savant-dataplane
description: Savant dataplane for self-managed Kubernetes deployments
type: application
version: 0.12.6
appVersion: "1.0.0"
home: https://savantlabs.io
icon: https://assets.savantlabs.io/brand/icon.svg
sources:
  - https://github.com/savantlabs/helm-charts
maintainers:
  - name: savantlabs
    url: https://github.com/savantlabs

dependencies:
  - name: zookeeper
    version: 13.8.7
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: zookeeper.enabled
  - name: spark-operator
    version: 2.5.0
    repository: https://kubeflow.github.io/spark-operator
    condition: spark-operator.enabled
  # Vendored fork of bitnami/spark (see charts/spark/SAVANT_PATCHES.md).
  # No `repository:` field — Helm resolves it from charts/spark/ in-tree.
  - name: spark
    version: 10.0.3
    condition: spark.enabled
  # Grafana Alloy — metrics forwarder for Savant SaaS-side observability.
  # Scrapes Savant pods' /actuator/prometheus and remote_writes to Savant.
  - name: alloy
    version: 1.8.1
    repository: https://grafana.github.io/helm-charts
    condition: savantConfig.telemetry.remoteWrite.enabled
