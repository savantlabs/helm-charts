apiVersion: v2
name: savant-dataplane
description: Savant dataplane for self-managed Kubernetes deployments
type: application
version: 0.3.0
appVersion: "1.0.0"
home: https://savantlabs.io
icon: https://assets.savantlabs.io/brand/icon.svg
sources:
  - https://github.com/savantlabs/helm-charts
maintainers:
  - name: savantlabs
    url: https://github.com/savantlabs

dependencies:
  - name: zookeeper
    version: 13.8.7
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: zookeeper.enabled
  - name: spark-operator
    version: 2.5.0
    repository: https://kubeflow.github.io/spark-operator
    condition: spark-operator.enabled
