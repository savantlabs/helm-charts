savantConfig:
  agentId: ""
  # Customer's cloud provider. Only 'aws' is supported today; reserving the
  # field for future gcp/azure support.
  cloudProvider: aws
  aws:
    # AWS region for SDK clients (sets AWS_REGION on Savant pods).
    region: ""
    # IRSA role ARN. The role's trust policy must list the subject
    # system:serviceaccount:<release-namespace>:savant-agent.
    roleArn: ""
    # S3 bucket used for agent staging/artifact storage.
    bucketName: ""
    # Customer-generated STS External ID for the Savant support role trust
    # chain. Leave empty to skip rendering the savant-secrets Secret.
    externalId: ""
  controlPlane:
    # WIF credential-config JSON (non-sensitive) for Savant's control-plane
    # backend. Provided by Savant in savant-onboarding.yaml. Mutually exclusive
    # with existingCredentialConfigMap.
    credentialConfig: ""
    # Alternatively, reference a customer-managed ConfigMap that contains
    # credential-config.json under the same key.
    existingCredentialConfigMap: ""
    # Savant-owned GCP project the credentialConfig federates to. Defaults to
    # savant-prod; override for non-production stacks (QA, dev). Flows into
    # agent and analytic-engine as GOOGLE_CLOUD_PROJECT.
    gcpProject: "savant-prod"
    # WIF audience for the projected ServiceAccount token mounted at
    # /var/run/secrets/gcp/token. Auto-parsed from credentialConfig.audience
    # when credentialConfig is set; required when using
    # existingCredentialConfigMap.
    wifAudience: ""
  telemetry:
    # OTLP endpoint for trace/metric export (gRPC). Leave empty to disable.
    # Point Savant pods at your own OpenTelemetry Collector if you want to
    # capture the signals (e.g., http://otel-collector.observability:4317).
    otlpEndpoint: ""

# ZooKeeper (Bitnami subchart) — cluster-internal coordination service.
# Customers normally should not touch this block. The escape hatches are exposed
# for advanced operators who need to tune resources, storage, or placement.
zookeeper:
  enabled: true
  # Fixed resource name (no release-name prefix), so consumers can reference
  # ZooKeeper by the deterministic DNS name `zookeeper.<namespace>`.
  fullnameOverride: zookeeper
  # Bitnami moved free community images to `bitnamilegacy/*` in Aug 2025; the
  # `bitnami/*` namespace now requires a paid subscription. These two settings
  # keep the chart on the free legacy image.
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/zookeeper
    tag: 3.9.3
  replicaCount: 3
  persistence:
    enabled: true
    size: 16Gi
    # storageClass unset: uses the cluster's default StorageClass. Override via
    # `global.storageClass` (applies to all subcharts) or `zookeeper.persistence.storageClass`.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    pool.savant.io/type: service
  podAntiAffinityPreset: hard
  pdb:
    create: true
    minAvailable: 2
  autopurge:
    snapRetainCount: 3
  auth:
    enabled: false
  tls:
    client:
      enabled: false
    quorum:
      enabled: false

# Spark Operator (Kubeflow subchart) — reconciles SparkApplication CRs submitted
# by the Savant runtime. `spark.jobNamespaces: [""]` means the operator watches
# all namespaces; scope it to specific namespaces if your org requires.
spark-operator:
  enabled: true
  controller:
    replicas: 2
    nodeSelector:
      pool.savant.io/type: service
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1200m
        memory: 2Gi
  webhook:
    # chart key is `enable`, not `enabled`
    enable: false
    # kept so that turning the webhook on doesn't need a second values change
    nodeSelector:
      pool.savant.io/type: service
  spark:
    jobNamespaces:
      - ""

# Spark standalone cluster (Bitnami subchart) — HA master (3 replicas via
# post-install hook) with ZooKeeper recovery, autoscaling workers.
spark:
  enabled: true
  # Fixed resource name so consumers reach masters via
  # `spark-master-N.spark-headless` DNS (matches Savant runtime expectations).
  fullnameOverride: spark
  global:
    security:
      # Required because we pull Spark from a non-Bitnami registry.
      allowInsecureImages: true
  image:
    registry: us-docker.pkg.dev
    repository: savant-prod/gcr.io/bitnami-spark
    tag: v3.5.6_2.13
    pullPolicy: IfNotPresent
  master:
    # HA master quorum. The vendored Bitnami chart adds support for this knob
    # (upstream hardcodes replicas: 1). See charts/spark/SAVANT_PATCHES.md.
    replicaCount: 3
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 1400m
        memory: 4Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values: ["master"]
            topologyKey: kubernetes.io/hostname
    nodeSelector:
      pool.savant.io/type: service
    service:
      type: ClusterIP
      headless: true
    # Keep quorum: tolerate at most one voluntary disruption of the 3-replica HA
    # master. Upstream key is `pdb`, not `podDisruptionBudget`.
    pdb:
      create: true
      minAvailable: 2
    # Wait for ZooKeeper to accept client connections before starting the
    # master. Spark recovery mode talks to ZK immediately; without this the
    # first 5–10 seconds of master startup are dominated by "Connection
    # refused" retries that eventually succeed but clutter the logs.
    initContainers:
      - name: wait-for-zookeeper
        image: busybox:1.36.1
        command:
          - sh
          - -c
          - |
            until nc -z zookeeper 2181; do
              echo "waiting for zookeeper..."
              sleep 2
            done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
    extraEnvVars:
      - name: SPARK_RECOVERY_MODE
        value: "ZOOKEEPER"
      - name: SPARK_DAEMON_JAVA_OPTS
        value: >-
          -Dspark.deploy.recoveryMode=ZOOKEEPER
          -Dspark.deploy.zookeeper.url=zookeeper.{{ .Release.Namespace }}:2181
          -Dspark.deploy.zookeeper.dir=/spark-ha/{{ .Release.Namespace }}/savant
      - name: SPARK_WORKER_TIMEOUT
        value: "60"
      - name: SPARK_DEAD_WORKER_PERSISTENCE
        value: "120"
  worker:
    # Static replica count. HPA is not a good fit for Spark workers (CPU/memory
    # metrics don't reflect queue depth). Capacity scales at the node level via
    # the cluster autoscaler as pending executor pods trigger node additions.
    replicaCount: 4
    resources:
      requests:
        cpu: "15"
        memory: 56Gi
        ephemeral-storage: 200Gi
      limits:
        cpu: 15500m
        memory: 56Gi
        ephemeral-storage: 200Gi
    nodeSelector:
      pool.savant.io/type: spark
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values: ["worker"]
              topologyKey: topology.kubernetes.io/zone
    # Workers are stateless and Spark retries failed stages; prefer cluster
    # elasticity (Spot reclaim, autoscaler consolidation) over a tight PDB.
    pdb:
      create: true
      maxUnavailable: 50%
    # Our vendored Bitnami fork gates its default single-master SPARK_MASTER_URL
    # behind this flag so we can set the full 3-master quorum URL below without
    # producing duplicate env keys. See charts/spark/SAVANT_PATCHES.md.
    skipDefaultMasterUrl: true
    extraEnvVars:
      - name: SPARK_MASTER_URL
        value: "spark://spark-master-0.spark-headless:7077,spark-master-1.spark-headless:7077,spark-master-2.spark-headless:7077"
      - name: SPARK_WORKER_CORES
        value: "15"
      - name: SPARK_WORKER_MEMORY
        value: "55g"
      - name: SPARK_WORKER_TIMEOUT
        value: "60"
      - name: SPARK_LOCAL_DIRS
        value: "/opt/bitnami/spark/data"
      - name: SPARK_WORKER_CLEANUP_ENABLED
        value: "true"
      - name: SPARK_WORKER_CLEANUP_INTERVAL
        value: "1800"
      - name: SPARK_WORKER_CLEANUP_APPDATA_TTL
        value: "604800"
    extraVolumes:
      - name: spark-worker-data
        emptyDir:
          sizeLimit: 200Gi
    extraVolumeMounts:
      - name: spark-worker-data
        mountPath: /opt/bitnami/spark/data

# TEI — HuggingFace Text Embeddings Inference server. Serves embedding
# requests for Savant's GenAI features. The model is part of the Savant-backend
# contract; changing it will break downstream vector search.
tei:
  enabled: true
  image:
    repository: ghcr.io/huggingface/text-embeddings-inference
    tag: cpu-1.8
    pullPolicy: IfNotPresent
  model: mixedbread-ai/mxbai-embed-large-v1
  replicaCount: 1
  resources:
    requests:
      cpu: 3
      memory: 12Gi
    limits:
      cpu: 4
      memory: 12Gi
  nodeSelector:
    pool.savant.io/type: runtime
  persistence:
    enabled: true
    size: 10Gi
    # storageClass unset: uses the cluster's default StorageClass. Override via
    # `global.storageClass` or `tei.persistence.storageClass`.
  service:
    port: 80

# Savant Agent — the Spring Boot service that orchestrates workflows on behalf
# of Savant's control plane.
agent:
  enabled: true
  image:
    repository: us-docker.pkg.dev/savant-prod/gcr.io/agent
    tag: v1.0.0
    pullPolicy: Always
  replicaCount: 1
  # Spring profile passed via SPRING_PROFILES_ACTIVE. Matches the backing
  # application.yml layout; QA/dev stacks override to `qa`.
  springProfiles: "prod"
  resources:
    requests:
      cpu: 1500m
      memory: 6Gi
    limits:
      cpu: 1700m
      memory: 6Gi
  nodeSelector:
    pool.savant.io/type: service
  service:
    port: 8080

# Savant Analytic Engine — Spark driver that submits workloads to the standalone
# Spark cluster and handles runtime execution for Savant analyses.
analyticEngine:
  enabled: true
  image:
    repository: us-docker.pkg.dev/savant-prod/gcr.io/spark-runtime
    tag: v1.0.0
    pullPolicy: Always
  replicaCount: 1
  # Spring profile passed via SPRING_PROFILES_ACTIVE. The `vpc-*` suffix tells
  # the runtime it's executing inside a customer VPC dataplane. QA/dev stacks
  # override to `qa,vpc-qa`.
  springProfiles: "prod,vpc-prod"
  resources:
    requests:
      cpu: 6
      memory: 28Gi
      ephemeral-storage: 32Gi
    limits:
      cpu: 7
      memory: 28Gi
      ephemeral-storage: 32Gi
  nodeSelector:
    pool.savant.io/type: runtime
  service:
    port: 8080
