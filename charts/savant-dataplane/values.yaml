savantConfig:
  agentId: ""
  # Customer's cloud provider. Only 'aws' is supported today; reserving the
  # field for future gcp/azure support.
  cloudProvider: aws
  aws:
    # AWS region for SDK clients (sets AWS_REGION on Savant pods).
    region: ""
    # IRSA role ARN. The role's trust policy must list the subject
    # system:serviceaccount:<release-namespace>:savant-agent.
    roleArn: ""
    # S3 bucket used for agent staging/artifact storage.
    bucketName: ""
    # Customer-generated STS External ID for the Savant support role trust
    # chain. Leave empty to skip rendering the savant-secrets Secret.
    externalId: ""
  controlPlane:
    # WIF credential-config JSON (non-sensitive) for Savant's control-plane
    # backend. Provided by Savant in savant-onboarding.yaml. Mutually exclusive
    # with existingCredentialConfigMap.
    credentialConfig: ""
    # Alternatively, reference a customer-managed ConfigMap that contains
    # credential-config.json under the same key.
    existingCredentialConfigMap: ""
    # Savant-owned GCP project the credentialConfig federates to. Defaults to
    # savant-prod; override for non-production stacks (QA, dev). Flows into
    # agent and analytic-engine as GOOGLE_CLOUD_PROJECT.
    gcpProject: "savant-prod"
    # WIF audience for the projected ServiceAccount token mounted at
    # /var/run/secrets/gcp/token. Auto-parsed from credentialConfig.audience
    # when credentialConfig is set; required when using
    # existingCredentialConfigMap.
    wifAudience: ""
  telemetry:
    # OTLP endpoint for trace export (gRPC). Leave empty to disable.
    # Point Savant pods at your own OpenTelemetry Collector if you want to
    # capture the signals (e.g., http://otel-collector.observability:4317).
    otlpEndpoint: ""
    # Prometheus remote_write forwarder. When enabled, an Alloy pod scrapes
    # Savant pods' /actuator/prometheus endpoints and ships the samples to
    # Savant's hosted receiver so support can diagnose issues without remote
    # shell access. Pods are discovered via `prometheus.io/scrape=true`
    # annotations — if you run your own Prometheus you can scrape them the
    # same way.
    #
    # Set enabled=false to keep all telemetry inside your VPC. The dataplane
    # functions identically either way; only Savant-side support visibility
    # changes.
    remoteWrite:
      enabled: true
      # Receiver URL. Savant's onboarding values file can override this;
      # otherwise the default applies.
      endpoint: https://metrics.savantlabs.io/api/v1/push

# ZooKeeper (Bitnami subchart) — cluster-internal coordination service.
# Customers normally should not touch this block. The escape hatches are exposed
# for advanced operators who need to tune resources, storage, or placement.
zookeeper:
  enabled: true
  # Fixed resource name (no release-name prefix), so consumers can reference
  # ZooKeeper by the deterministic DNS name `zookeeper.<namespace>`.
  fullnameOverride: zookeeper
  # Bitnami moved free community images to `bitnamilegacy/*` in Aug 2025; the
  # `bitnami/*` namespace now requires a paid subscription. These two settings
  # keep the chart on the free legacy image.
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/zookeeper
    tag: 3.9.3
  replicaCount: 3
  persistence:
    enabled: true
    size: 16Gi
    # storageClass unset: uses the cluster's default StorageClass. Override via
    # `global.storageClass` (applies to all subcharts) or `zookeeper.persistence.storageClass`.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    pool.savant.io/type: service
  podAntiAffinityPreset: hard
  pdb:
    create: true
    minAvailable: 2
  autopurge:
    snapRetainCount: 3
  auth:
    enabled: false
  tls:
    client:
      enabled: false
    quorum:
      enabled: false
  # Enable the Bitnami ZooKeeper Prometheus metrics endpoint (served in-process
  # by the ZooKeeper container on port 9141).
  metrics:
    enabled: true
  # Scrape opt-in for the in-chart Alloy forwarder. The exporter is a side-car
  # in the ZooKeeper pod, so the annotations must live on the POD — Alloy
  # discovers with role="pod". (Bitnami's own metrics.service.annotations land
  # on the metrics Service, which pod-role discovery never sees.)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9141"
    prometheus.io/path: "/metrics"

# Spark Operator (Kubeflow subchart) — reconciles SparkApplication CRs submitted
# by the Savant runtime. `spark.jobNamespaces: [""]` means the operator watches
# all namespaces; scope it to specific namespaces if your org requires.
spark-operator:
  enabled: true
  controller:
    replicas: 2
    nodeSelector:
      pool.savant.io/type: service
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1200m
        memory: 2Gi
  webhook:
    # chart key is `enable`, not `enabled`
    enable: false
    # kept so that turning the webhook on doesn't need a second values change
    nodeSelector:
      pool.savant.io/type: service
  spark:
    jobNamespaces:
      - ""

# Spark standalone cluster (Bitnami subchart) — HA master (3 replicas via
# post-install hook) with ZooKeeper recovery, autoscaling workers.
spark:
  enabled: true
  # Fixed resource name so consumers reach masters via
  # `spark-master-N.spark-headless` DNS (matches Savant runtime expectations).
  fullnameOverride: spark
  global:
    security:
      # Required because we pull Spark from a non-Bitnami registry.
      allowInsecureImages: true
  # Reuse the chart's savant-agent ServiceAccount on master and worker pods so
  # Spark executors inherit IRSA credentials (and WIF token mounts once the
  # chart wires them for spark pods). Otherwise the Bitnami subchart creates
  # its own unprivileged 'spark' SA and executors fail to authenticate to S3.
  serviceAccount:
    create: false
    name: savant-agent
  image:
    registry: us-docker.pkg.dev
    repository: savant-prod/gcr.io/bitnami-spark
    tag: v3.5.6_2.13
    pullPolicy: IfNotPresent
  # Enable the Spark Prometheus metrics endpoint (served in-process via
  # SPARK_METRICS_ENABLED) on master and worker pods. The subchart stamps its
  # masterAnnotations/workerAnnotations (prometheus.io/scrape, path /metrics/,
  # port = containerPorts.http) onto the pods when this is on, so the in-chart
  # Alloy forwarder discovers them with no further wiring.
  metrics:
    enabled: true
  master:
    # HA master quorum. The vendored Bitnami chart adds support for this knob
    # (upstream hardcodes replicas: 1). See charts/spark/SAVANT_PATCHES.md.
    replicaCount: 3
    resources:
      requests:
        cpu: 1000m
        memory: 4Gi
      limits:
        cpu: 1400m
        memory: 4Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values: ["master"]
            topologyKey: kubernetes.io/hostname
    nodeSelector:
      pool.savant.io/type: service
    service:
      type: ClusterIP
      headless: true
    # Keep quorum: tolerate at most one voluntary disruption of the 3-replica HA
    # master. Upstream key is `pdb`, not `podDisruptionBudget`.
    pdb:
      create: true
      minAvailable: 2
    # Wait for ZooKeeper to accept client connections before starting the
    # master. Spark recovery mode talks to ZK immediately; without this the
    # first 5–10 seconds of master startup are dominated by "Connection
    # refused" retries that eventually succeed but clutter the logs.
    initContainers:
      - name: wait-for-zookeeper
        image: busybox:1.36.1
        command:
          - sh
          - -c
          - |
            until nc -z zookeeper 2181; do
              echo "waiting for zookeeper..."
              sleep 2
            done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
    extraEnvVars:
      - name: SPARK_RECOVERY_MODE
        value: "ZOOKEEPER"
      - name: SPARK_DAEMON_JAVA_OPTS
        value: >-
          -Dspark.deploy.recoveryMode=ZOOKEEPER
          -Dspark.deploy.zookeeper.url=zookeeper.{{ .Release.Namespace }}:2181
          -Dspark.deploy.zookeeper.dir=/spark-ha/{{ .Release.Namespace }}/savant
      - name: SPARK_WORKER_TIMEOUT
        value: "60"
      - name: SPARK_DEAD_WORKER_PERSISTENCE
        value: "120"
  worker:
    # Seed replica count for a fresh install only. At runtime the Savant agent's
    # pressure-based controller owns the worker pool size, scaling it in step
    # with analytic-engine demand using execution queue depth as the signal.
    # A Kubernetes HPA stays disabled on purpose: CPU/memory utilization does
    # not reflect queue depth, and an external controller — not an HPA — drives
    # the count. The worker StatefulSet omits `replicas` on upgrade (see
    # statefulset-worker.yaml), so Helm does not fight the controller. Cluster
    # autoscaling still provides node capacity underneath.
    replicaCount: 4
    resources:
      requests:
        cpu: "15"
        memory: 56Gi
        ephemeral-storage: 200Gi
      limits:
        cpu: 15500m
        memory: 56Gi
        ephemeral-storage: 200Gi
    nodeSelector:
      pool.savant.io/type: spark
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values: ["worker"]
              topologyKey: topology.kubernetes.io/zone
    # Workers hold ephemeral cached data — Spark local-checkpoint blocks, not
    # just shuffle output — so losing a worker can fail an in-flight analysis
    # rather than merely trigger a stage retry. Scale-in therefore drains a
    # worker before it stops (see lifecycleHooks below), migrating its cached
    # blocks to surviving workers first. The PDB stays tolerant so involuntary
    # disruptions (Spot reclaim, autoscaler consolidation) are not blocked; the
    # graceful path covers routine controller-driven scale-in.
    pdb:
      create: true
      maxUnavailable: 50%
    # Graceful scale-in for the controller-driven worker pool. Enable Spark
    # worker decommissioning so a terminating worker hands its RDD and
    # local-checkpoint blocks off to surviving workers instead of dropping them
    # (a dropped local-checkpoint block is unrecoverable — its lineage was
    # truncated when it was cached). The standalone worker gates its SIGPWR
    # decommission handler on spark.decommission.enabled (the same key the
    # driver uses), not on a worker-scoped variant.
    configOptions: "-Dspark.decommission.enabled=true"
    # preStop signals the Spark worker process (SIGPWR = decommission) and then
    # waits, so in-flight block migration can finish before the container gets
    # SIGTERM. The worker JVM is not PID 1 (a launcher script is), so it is
    # targeted by command line rather than by PID. Keep
    # terminationGracePeriodSeconds comfortably above the preStop wait so
    # Kubernetes does not SIGKILL before migration completes. Both values are
    # initial estimates — tune against observed migration time.
    terminationGracePeriodSeconds: 150
    lifecycleHooks:
      preStop:
        exec:
          command:
            - /bin/sh
            - -c
            - 'pkill --signal PWR -f "deploy.worker.Worker --webui-port" || true; sleep 120'
    # Our vendored Bitnami fork gates its default single-master SPARK_MASTER_URL
    # behind this flag so we can set the full 3-master quorum URL below without
    # producing duplicate env keys. See charts/spark/SAVANT_PATCHES.md.
    skipDefaultMasterUrl: true
    extraEnvVars:
      - name: SPARK_MASTER_URL
        value: "spark://spark-master-0.spark-headless:7077,spark-master-1.spark-headless:7077,spark-master-2.spark-headless:7077"
      - name: SPARK_WORKER_CORES
        value: "15"
      - name: SPARK_WORKER_MEMORY
        value: "55g"
      - name: SPARK_WORKER_TIMEOUT
        value: "60"
      - name: SPARK_LOCAL_DIRS
        value: "/opt/bitnami/spark/data"
      - name: SPARK_WORKER_CLEANUP_ENABLED
        value: "true"
      - name: SPARK_WORKER_CLEANUP_INTERVAL
        value: "1800"
      - name: SPARK_WORKER_CLEANUP_APPDATA_TTL
        value: "604800"
    extraVolumes:
      - name: spark-worker-data
        emptyDir:
          sizeLimit: 200Gi
    extraVolumeMounts:
      - name: spark-worker-data
        mountPath: /opt/bitnami/spark/data

# TEI — HuggingFace Text Embeddings Inference server. Serves embedding
# requests for Savant's GenAI features. The model is part of the Savant-backend
# contract; changing it will break downstream vector search.
tei:
  enabled: true
  image:
    repository: ghcr.io/huggingface/text-embeddings-inference
    tag: cpu-1.8
    pullPolicy: IfNotPresent
  model: mixedbread-ai/mxbai-embed-large-v1
  replicaCount: 1
  resources:
    requests:
      cpu: 3
      memory: 12Gi
    limits:
      cpu: 4
      memory: 12Gi
  nodeSelector:
    pool.savant.io/type: runtime
  persistence:
    enabled: true
    size: 10Gi
    # storageClass unset: uses the cluster's default StorageClass. Override via
    # `global.storageClass` or `tei.persistence.storageClass`.
  service:
    port: 80

# Savant Agent — the Spring Boot service that orchestrates workflows on behalf
# of Savant's control plane.
agent:
  enabled: true
  image:
    repository: us-docker.pkg.dev/savant-prod/gcr.io/agent
    tag: v1.0.0
    pullPolicy: Always
  replicaCount: 1
  # Spring profile passed via SPRING_PROFILES_ACTIVE. Matches the backing
  # application.yml layout; QA/dev stacks override to `qa`.
  springProfiles: "prod"
  resources:
    requests:
      cpu: 1500m
      memory: 6Gi
    limits:
      cpu: 1700m
      memory: 6Gi
  nodeSelector:
    pool.savant.io/type: service
  # Local scratch space for staged file downloads. Large sources (e.g. multi-GB
  # OneDrive/CSV files) are cached under /opt/app/.tmp before processing. When
  # enabled, a dedicated CSI volume is provisioned per pod and deleted with it,
  # so large files don't consume the node's ephemeral storage. The volume is
  # bound after the pod is scheduled, so it lands in the pod's availability zone
  # and is not pinned across restarts. Set enabled: false to fall back to an
  # emptyDir on the node disk (requires a node pool with sufficient disk).
  persistence:
    enabled: true
    size: 100Gi
    # storageClass unset: uses the cluster's default StorageClass (gp3 EBS on
    # EKS). Override via `global.storageClass` or `agent.persistence.storageClass`.
  service:
    port: 8080

# Savant Analytic Engine — Spark driver that submits workloads to the standalone
# Spark cluster and handles runtime execution for Savant analyses.
analyticEngine:
  enabled: true
  image:
    repository: us-docker.pkg.dev/savant-prod/gcr.io/spark-runtime
    tag: v1.0.0
    pullPolicy: Always
  replicaCount: 1
  # Floor: minimum number of analytic engines kept always-on (the "warm floor"
  # from the Capacity Planning guide; range 1-8). Rendered onto the agent
  # deployment as SAVANT_VPC_ANALYTICENGINE_MIN, which overrides
  # savant.vpc.analytic-engine.min in the agent's application.yaml.
  floor: 1
  # Tier: per-engine Spark power (small | medium | large) — see the Capacity
  # Planning guide. Rendered onto the analytic-engine statefulset as
  # RUNTIME_VPC_TIER, which overrides runtime.vpc.tier in the runtime config.
  tier: small
  # Spring profile passed via SPRING_PROFILES_ACTIVE. The `vpc-*` suffix tells
  # the runtime it's executing inside a customer VPC dataplane. QA/dev stacks
  # override to `qa,vpc-qa`.
  springProfiles: "prod,vpc-prod"
  resources:
    requests:
      cpu: 6
      memory: 28Gi
      ephemeral-storage: 32Gi
    limits:
      cpu: 7
      memory: 28Gi
      ephemeral-storage: 32Gi
  nodeSelector:
    pool.savant.io/type: runtime
  service:
    port: 8080

# Grafana Alloy (metrics forwarder subchart). Only deployed when
# savantConfig.telemetry.remoteWrite.enabled is true. We render our own
# ConfigMap (see templates/metrics-forwarder-config.yaml) and our own
# namespace-scoped RBAC (see templates/metrics-forwarder-rbac.yaml), so the
# subchart is configured to not create those itself.
alloy:
  alloy:
    configMap:
      create: false
      name: savant-metrics-forwarder-config
      key: config.alloy
    clustering:
      enabled: false
  controller:
    type: deployment
    replicas: 1
    nodeSelector:
      pool.savant.io/type: service
  serviceAccount:
    create: true
    name: savant-metrics-forwarder
  rbac:
    create: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Warm pool — pre-provisions node capacity so elastic workloads start faster.
# Currently this block only defines the PriorityClass; the pause-pod workload
# that consumes it via `priorityClassName` is provisioned separately.
warmPool:
  priorityClass:
    # PriorityClass is cluster-scoped. Assumes one dataplane release per
    # cluster — if multiple releases share a cluster, only one should create
    # this (otherwise the second install conflicts on the shared object).
    create: true
    name: warmup-pods
    # Negative priority: warm-pool pause pods are always preempted by real
    # workloads when the node is under resource pressure.
    value: -10

# Internal knobs — not part of the customer-facing values API. Subject to
# change without notice between chart versions.
_internal:
  # Replica reconciliation control. By default, `spec.replicas` is rendered
  # only on first install; subsequent `helm upgrade` runs omit the field so
  # out-of-band scaling (Savant agent k8s client, `kubectl scale`) survives
  # upgrades. Set forceReplicas=true to make `helm upgrade` reassert the
  # configured replicaCount — recovery escape hatch for ops.
  agent:
    forceReplicas: false
  analyticEngine:
    forceReplicas: false
