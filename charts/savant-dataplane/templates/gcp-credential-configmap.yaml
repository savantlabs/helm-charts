{{- if and .Values.savantConfig.gcp.credentialConfig (not .Values.savantConfig.gcp.existingCredentialConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gcp-credential-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
data:
  credential-config.json: |
{{ .Values.savantConfig.gcp.credentialConfig | indent 4 }}
{{- end }}
