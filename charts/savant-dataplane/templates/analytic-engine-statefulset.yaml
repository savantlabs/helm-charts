{{- if .Values.analyticEngine.enabled }}
{{- $credConfigMap := .Values.savantConfig.controlPlane.existingCredentialConfigMap | default "gcp-credential-config" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analytic-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytic-engine
spec:
  replicas: {{ .Values.analyticEngine.replicaCount }}
  serviceName: analytic-engine
  selector:
    matchLabels:
      app.kubernetes.io/name: savant-dataplane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: analytic-engine
  template:
    metadata:
      labels:
        {{- include "savant-dataplane.labels" . | nindent 8 }}
        app.kubernetes.io/component: analytic-engine
      annotations:
        # Single-replica Spark driver; losing the pod restarts all in-flight
        # analyses. Pin the pod to its node so voluntary disruption (autoscaler
        # scale-down, Karpenter consolidation) can't evict it.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: savant-agent
      {{- with .Values.analyticEngine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: gcp-credential-config
          configMap:
            name: {{ $credConfigMap }}
        - name: shared-data
          emptyDir: {}
      containers:
        - name: spark
          image: "{{ .Values.analyticEngine.image.repository }}:{{ .Values.analyticEngine.image.tag }}"
          imagePullPolicy: {{ .Values.analyticEngine.image.pullPolicy }}
          ports:
            - name: http-spark
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: gcp-credential-config
              mountPath: /var/run/gcp
              readOnly: true
            - name: shared-data
              mountPath: /mnt/shared-data
          env:
            - name: RUNTIME_SPARK_MASTER
              value: "spark://spark-master-0.spark-headless:7077,spark-master-1.spark-headless:7077,spark-master-2.spark-headless:7077"
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OTEL_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=spark-runtime"
            {{- with .Values.savantConfig.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: SPRING_PROFILES_ACTIVE
              value: "prod,vpc-prod"
            - name: LOG_FORMAT
              value: "eks"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/credential-config.json
            - name: RUNTIME_VPC_CLOUD_PROVIDER
              value: {{ .Values.savantConfig.cloudProvider | quote }}
            - name: RUNTIME_VPC_STAGING_PREFIX
              value: "/tmp"
            - name: SAVANT_K8S_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SAVANT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUNTIME_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAVANT_AGENT_ID
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_ID
            - name: SAVANT_STACK
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_STACK
            {{- if eq .Values.savantConfig.cloudProvider "aws" }}
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_BUCKET
            - name: SAVANT_AGENT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_BUCKET
            - name: RUNTIME_VPC_STAGING_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_BUCKET
            {{- if .Values.savantConfig.aws.externalId }}
            - name: AWS_STS_EXTERNAL_ID
              valueFrom:
                secretKeyRef:
                  name: savant-secrets
                  key: AWS_STS_EXTERNAL_ID
            {{- end }}
            {{- end }}
            {{- if .Values.tei.enabled }}
            - name: GENAI_TEI_ENDPOINT
              value: "http://tei:{{ .Values.tei.service.port }}/v1"
            {{- end }}
          resources:
            {{- toYaml .Values.analyticEngine.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http-spark
            initialDelaySeconds: 5
            failureThreshold: 100
            periodSeconds: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http-spark
            failureThreshold: 5
            periodSeconds: 6
{{- end }}
