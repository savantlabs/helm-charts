{{- if and (eq .Values.savantConfig.cloudProvider "aws") .Values.savantConfig.aws.externalId }}
apiVersion: v1
kind: Secret
metadata:
  name: savant-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_STS_EXTERNAL_ID: {{ .Values.savantConfig.aws.externalId | quote }}
{{- end }}
