{{- if .Values.genai.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: genai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: savant-dataplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: genai
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.genai.service.port }}
      targetPort: http
{{- end }}
