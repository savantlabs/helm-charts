{{- if .Values.genai.enabled }}
{{- $credConfigMap := .Values.savantConfig.controlPlane.existingCredentialConfigMap | default "gcp-credential-config" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai
spec:
  {{- include "savant-dataplane.replicas" (dict "ctx" . "kind" "Deployment" "name" "genai" "replicas" .Values.genai.replicaCount "force" .Values._internal.genai.forceReplicas) | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: savant-dataplane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: genai
  template:
    metadata:
      labels:
        {{- include "savant-dataplane.labels" . | nindent 8 }}
        app.kubernetes.io/component: genai
      annotations:
        # Single-replica; conversation state is held in-process, so losing the pod
        # drops live conversations. Pin it so voluntary disruption (autoscaler
        # scale-down, Karpenter consolidation) can't evict it.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        karpenter.sh/do-not-disrupt: "true"
        # Prometheus scrape opt-in. The service is served under the /genai context
        # path, so the actuator endpoint sits below it too.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/genai/actuator/prometheus"
    spec:
      # Runs as uid/gid 1001 (app), matching the agent.
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: savant-agent
      {{- with .Values.genai.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: gcp-credential-config
          configMap:
            name: {{ $credConfigMap }}
        # Projected ServiceAccount token for GCP Workload Identity Federation, the
        # same mechanism the agent and analytic-engine use.
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: {{ include "savant-dataplane.wifAudience" . | quote }}
      containers:
        - name: spring-boot
          image: "{{ .Values.genai.image.repository }}:{{ .Values.genai.image.tag }}"
          imagePullPolicy: {{ .Values.genai.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: gcp-credential-config
              mountPath: /var/run/gcp
              readOnly: true
            - name: gcp-token
              mountPath: /var/run/secrets/gcp
              readOnly: true
          # Optional, not managed by this chart: create either object to add
          # environment variables without a chart upgrade, then restart the
          # deployment. Because `env` below wins on key conflicts, these can add
          # settings but not override the ones the chart sets.
          envFrom:
            - configMapRef:
                name: genai-env
                optional: true
            - secretRef:
                name: genai-secrets
                optional: true
          env:
            - name: OTEL_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.savantConfig.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/credential-config.json
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.savantConfig.controlPlane.gcpProject | quote }}
            - name: LOG_FORMAT
              value: "eks"
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.genai.springProfiles | quote }}
            - name: SAVANT_K8S_ISINK8S
              value: "true"
            - name: SAVANT_K8S_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SAVANT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAVANT_STACK
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_STACK
            # In-namespace ZooKeeper, deployed by this chart.
            - name: SAVANT_ZOOKEEPER_CONNECTSTRING
              value: "zookeeper"
            # DataFabric is the control plane's Pub/Sub transport. Nothing routes to
            # this service from outside the cluster yet, so the subscription would
            # sit idle.
            - name: SAVANT_DATAFABRIC_ENABLED
              value: {{ .Values.genai.datafabric.enabled | quote }}
            {{- if eq .Values.savantConfig.cloudProvider "aws" }}
            # Conversation storage on the customer's own bucket, reached with the
            # ServiceAccount's IRSA credentials.
            - name: GENAI_STORAGE_PROVIDER
              value: "s3"
            - name: GENAI_STORAGE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_BUCKET
            # Stating the region avoids a startup round-trip: without it the S3
            # client probes the bucket from us-east-1 and recovers the real region
            # from the resulting error, logging it as a failure along the way.
            - name: GENAI_STORAGE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: AWS_DEFAULT_REGION
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: AWS_DEFAULT_REGION
            {{- end }}
          resources:
            {{- toYaml .Values.genai.resources | nindent 12 }}
          # Startup is slow: the context builds agent definitions and tool
          # registries before serving. Measured at ~165s, so the window below
          # leaves generous headroom — shrink it only against measurements.
          startupProbe:
            httpGet:
              path: /genai/health
              port: http
            initialDelaySeconds: 30
            failureThreshold: 50
            periodSeconds: 6
          livenessProbe:
            httpGet:
              path: /genai/health
              port: http
            failureThreshold: 5
            periodSeconds: 6
{{- end }}
