apiVersion: v1
kind: ServiceAccount
metadata:
  name: savant-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
  {{- if and (eq .Values.savantConfig.cloudProvider "aws") .Values.savantConfig.aws.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.savantConfig.aws.roleArn | quote }}
  {{- end }}
{{- if .Values.genai.enabled }}
---
# Identity for genai's sandbox pods, which run untrusted, model-written code.
# Deliberately empty: no token mounted, no RBAC, no cloud IAM annotation, so a
# sandbox cannot call the Kubernetes API or reach the agent's credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: genai
automountServiceAccountToken: false
{{- end }}
