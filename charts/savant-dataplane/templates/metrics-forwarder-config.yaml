{{- if .Values.savantConfig.telemetry.remoteWrite.enabled }}
# Alloy River config for the in-chart metrics forwarder. Discovers Savant pods
# via `prometheus.io/scrape` annotations, scrapes /actuator/prometheus, and
# remote_writes to the Savant-side receiver populated from
# savantConfig.telemetry.remoteWrite.endpoint.
#
# Filtering is denylist-based: anything Spring Boot / Micrometer exposes
# flows through unless explicitly dropped. New metrics surface in Mimir as
# soon as the code that emits them ships — no chart change required.
#
# The cardinality risk worth defending against is a metric whose label set
# embeds user data (customer ID, query text, file path). If one of those
# slips through, add a `drop` rule below — keep it metric-name-specific so
# unrelated series aren't collateral damage.
apiVersion: v1
kind: ConfigMap
metadata:
  name: savant-metrics-forwarder-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-forwarder
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = [{{ .Release.Namespace | quote }}]
      }
    }

    discovery.relabel "savant_scrape_targets" {
      targets = discovery.kubernetes.pods.targets

      // Opt-in: only pods that declare prometheus.io/scrape=true.
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }

      // Rewrite __address__ from pod IP + annotation port.
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
        regex         = "(\\d+);(.+)"
        target_label  = "__address__"
        replacement   = "$2:$1"
      }

      // Honour the annotation-declared metrics path.
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        target_label  = "__metrics_path__"
      }

      // Expose Savant-relevant pod metadata as labels on the scraped series.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
        target_label  = "savant_component"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    }

    prometheus.scrape "savant" {
      targets         = discovery.relabel.savant_scrape_targets.output
      forward_to      = [prometheus.relabel.denylist.receiver]
      scrape_interval = "1m"
    }

    prometheus.relabel "denylist" {
      forward_to = [prometheus.remote_write.savant.receiver]

      // Drops go here, one rule per offender. Empty by default.
      // Example, if some_metric ever embeds user data in its labels:
      //
      //   rule {
      //     source_labels = ["__name__"]
      //     regex         = "some_metric"
      //     action        = "drop"
      //   }
    }

    prometheus.remote_write "savant" {
      endpoint {
        url = {{ .Values.savantConfig.telemetry.remoteWrite.endpoint | quote }}

        headers = {
          "X-Scope-OrgID" = {{ .Values.savantConfig.agentId | quote }},
        }
      }

      // Add tenant identity as an external label as well, so queries that
      // don't respect the header still see which agent a series came from.
      external_labels = {
        tenant = {{ .Values.savantConfig.agentId | quote }},
      }
    }
{{- end }}
