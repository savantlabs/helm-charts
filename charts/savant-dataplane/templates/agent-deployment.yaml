{{- if .Values.agent.enabled }}
{{- $credConfigMap := .Values.savantConfig.controlPlane.existingCredentialConfigMap | default "gcp-credential-config" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "savant-dataplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  {{- include "savant-dataplane.replicas" (dict "ctx" . "kind" "Deployment" "name" "agent" "replicas" .Values.agent.replicaCount "force" .Values._internal.agent.forceReplicas) | nindent 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: savant-dataplane
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "savant-dataplane.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      annotations:
        # Single-replica, not yet HA. Pin the pod so voluntary disruption
        # (autoscaler scale-down, Karpenter consolidation) can't evict it.
        # Remove these once the agent supports running multiple replicas.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        karpenter.sh/do-not-disrupt: "true"
        # Prometheus scrape opt-in. Consumed by the in-chart Alloy forwarder
        # when savantConfig.telemetry.remoteWrite is enabled, and by any
        # customer-side Prometheus that honours the same convention.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # The agent runs as uid/gid 1001 (app). Mounted volumes — the scratch
      # volume at /opt/app/.tmp (CSI volume or emptyDir) — come up root-owned, so
      # without fsGroup the agent can't create its cache dir there. fsGroup makes
      # the mount group-writable by 1001; OnRootMismatch skips the recursive
      # chown on restart when the volume root is already group-owned correctly,
      # which matters for a large populated scratch volume.
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: savant-agent
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: gcp-credential-config
          configMap:
            name: {{ $credConfigMap }}
        # Projected EKS ServiceAccount token used by GCP Workload Identity
        # Federation. The audience must match the WIF provider registered for
        # this agent (set via savantConfig.controlPlane.wifAudience, auto-parsed
        # from credentialConfig when available).
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: {{ include "savant-dataplane.wifAudience" . | quote }}
        - name: java-libs
          emptyDir: {}
        # Local scratch for staged file downloads (e.g. multi-GB OneDrive/CSV
        # sources cached under /opt/app/.tmp before processing). When persistence
        # is enabled this is a dedicated CSI volume so large files don't consume
        # the node's ephemeral storage; otherwise it falls back to an emptyDir on
        # the node disk.
        - name: agent-tmp
          {{- if .Values.agent.persistence.enabled }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: {{ .Values.agent.persistence.size }}
                {{- with .Values.agent.persistence.storageClass }}
                storageClassName: {{ . | quote }}
                {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: spring-boot
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: gcp-credential-config
              mountPath: /var/run/gcp
              readOnly: true
            - name: gcp-token
              mountPath: /var/run/secrets/gcp
              readOnly: true
            - name: java-libs
              mountPath: /opt/app/libs
            - name: agent-tmp
              mountPath: /opt/app/.tmp
          env:
            - name: OTEL_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.savantConfig.telemetry.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/credential-config.json
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.savantConfig.controlPlane.gcpProject | quote }}
            - name: LOG_FORMAT
              value: "eks"
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.agent.springProfiles | quote }}
            - name: SAVANT_AGENT_STAGING_PREFIX
              value: "/tmp"
            # Analytic-engine floor (always-on minimum). Overrides
            # savant.vpc.analytic-engine.min in the agent's application.yaml.
            - name: SAVANT_VPC_ANALYTICENGINE_MIN
              value: {{ .Values.analyticEngine.floor | quote }}
            - name: SAVANT_K8S_ISINK8S
              value: "true"
            - name: SAVANT_K8S_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SAVANT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SAVANT_AGENT_ID
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_ID
            - name: SAVANT_AGENT_CLOUD_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_CLOUD_PROVIDER
            # Canonical relaxed-binding env for agent.agent.cloudProvider, so the
            # property can move off the ${SAVANT_AGENT_CLOUD_PROVIDER} placeholder.
            - name: AGENT_AGENT_CLOUDPROVIDER
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_CLOUD_PROVIDER
            - name: SAVANT_STACK
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_STACK
            {{- if eq .Values.savantConfig.cloudProvider "aws" }}
            - name: SAVANT_AGENT_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_BUCKET
            - name: SAVANT_AGENT_STAGING_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: SAVANT_AGENT_BUCKET
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: savant-config
                  key: AWS_DEFAULT_REGION
            # AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE are injected by the
            # EKS pod-identity webhook from the ServiceAccount annotation — do
            # not set AWS_ROLE_ARN here or the webhook skips injection and the
            # SDK's WebIdentityTokenCredentialsProvider can't find the token.
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /agent/health
              port: http
            initialDelaySeconds: 60
            failureThreshold: 20
            periodSeconds: 6
          livenessProbe:
            httpGet:
              path: /agent/health
              port: http
            failureThreshold: 5
            periodSeconds: 6
{{- end }}
